[project]
name = "universal-ai-story-to-video"
version = "0.1.0"
description = "Agent-based AI story-to-video generation platform."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.128.0",
  "python-dotenv>=1.0.0",
  "pydantic>=2.12.0",
  "uvicorn[standard]>=0.35.0",
  "pypdf>=5.0.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "httpx>=0.28.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
